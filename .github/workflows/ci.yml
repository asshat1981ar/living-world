name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run it by hand on any branch: gh workflow run CI --ref <branch>
  workflow_dispatch:

# A newer push to a pull request replaces its older run. Every other run (a commit on main, a manual run) has a group of
# its own, so nothing is cancelled or replaced and a quick follow-up commit never leaves the earlier one without a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  invariants-and-python:
    name: Invariants + Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the dependency isolation gate diffs the PR against its base commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: G1/G8/G9 invariant check
        run: python3 tools/check_invariants.py --all
      - name: Dependency isolation gate (vs the base commit)
        env:
          # The base commit of the PR, or the pushed commit itself on a push to main.
          CI_BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 tools/check_invariants.py --base "$CI_BASE_REF"
      - name: Tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  kotlin-check:
    name: Gradle check (KMP + Android lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools"; the "tools" package no longer exists and fails sdkmanager.
          packages: ""
      - name: Install Android SDK 34
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Check
        run: ./gradlew check --no-daemon --console=plain
      - name: Kotlin goldens (the kernel must still match tests/golden)
        run: |
          set -euo pipefail
          mkdir -p build/golden-logs
          # tests/golden/scenarios.json is the one list of scenarios (tools/test_scenarios.py keeps everything in step).
          # tools/list_scenarios.sh validates the file (tools/test_scenarios.py runs it on bad inputs) and exits non-zero
          # on any problem; capturing its output as a plain assignment lets set -e stop the step.
          config=$(bash tools/list_scenarios.sh tests/golden/scenarios.json)
          days=${config%%$'\n'*}
          mapfile -t scenarios <<< "${config#*$'\n'}"
          for s in "${scenarios[@]}"; do
            [[ "$s" =~ ^[a-z][a-z0-9_]*$ ]] || { echo "bad scenario name: $s"; exit 1; }
            extra=""
            if [ "$s" != "default" ]; then extra="--scenario=$s"; fi
            log="build/golden-logs/$s.log"
            # The runner exits 0 even on a mismatch, so the "Golden : OK" line is the actual verdict.
            if ! ./gradlew :desktopApp:run --no-daemon --console=plain -q \
                 --args="$days 0 $extra --golden=tests/golden/$s-${days}d.txt.gz --state-golden=tests/golden/$s-${days}d.state.txt.gz" > "$log" 2>&1; then
              cat "$log"; exit 1
            fi
            if ! grep -q "^Golden *: OK" "$log" || ! grep -q "^StateGolden *: OK" "$log"; then
              echo "golden $s does not match tests/golden/$s-${days}d(.state).txt.gz"
              cat "$log"; exit 1
            fi
            echo "golden $s OK"
          done
      - name: Determinism (G8) - the same run twice must give the same fingerprint
        run: |
          set -euo pipefail
          # The same two runs as the stop gate's determinism tier (tools/hooks/stop_gate.py DETERMINISM_SCENARIOS);
          # tools/test_scenarios.py checks that the arguments agree. Separate JVMs, because that is what G8 is about.
          for spec in "30 0" "15 0 --scenario=turmoil"; do
            first=$(./gradlew :desktopApp:run --no-daemon --console=plain -q --args="$spec" | grep '^Fingerprint' || true)
            second=$(./gradlew :desktopApp:run --no-daemon --console=plain -q --args="$spec" | grep '^Fingerprint' || true)
            if [ -z "$first" ] || [ "$first" != "$second" ]; then
              echo "G8: '$spec' gave '$first' then '$second'"; exit 1
            fi
            echo "deterministic: $spec -> $first"
          done
      - name: Build the debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --console=plain
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          # Fetch with: gh run download -n living-world-debug-apk (for testing on a phone)
          name: living-world-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/test-results/
            build/golden-logs/
